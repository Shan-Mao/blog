# ============================================================
#  工具数据  ——  供 /tools/ 页面使用
# ------------------------------------------------------------
#  新增一个工具 =
#      1. 在下面 tools: 里加一条记录，category 写上所属分类的 id
#      2. 如果那个分类还没出现过，先在 categories: 里加一条
#  不需要改任何模板、CSS 或 JS。
#
#  categories 字段说明：
#    id          必填。分类的唯一标识，英文小写、用 - 连接，
#                同时也是页面上锚点的名字（点击导航跳转用它）
#    name        必填。分类显示名称
#    description 可选。分类下面的一句话说明
#
#  tools 字段说明：
#    name        必填。工具名称
#    url         必填。访问地址，写完整 URL（http:// 或 https:// 开头）
#    category    必填。所属分类的 id，必须和上面 categories 里的 id 对上
#    description 可选。一句话说明
#    icon        可选。图标，两种写法都行：
#                  - 图片地址：https://... 或 /images/...（放在 static/ 里）
#                  - 一个 emoji，比如 🔍（直接粘贴进来即可）
#                不填时自动用工具名称的第一个字顶上去。
#
#  注意：列表项前必须有 "- "，字段缩进两格，不要用 Tab。
#  分类的顺序 = 页面上从上到下的显示顺序 = 左侧导航的顺序。
# ============================================================


# ------------------------------------------------------------
#  分类列表
#  想调顺序就上下移动这几段；不想要的分类直接删掉即可。
# ------------------------------------------------------------
